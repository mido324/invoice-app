<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- Rounded square background -->
  <rect width="512" height="512" rx="112" fill="#4f46e5"/>
  <!-- Paper shadow -->
  <rect x="136" y="108" width="256" height="320" rx="18" fill="#3730a3" opacity="0.4"/>
  <!-- Paper body -->
  <rect x="124" y="96" width="256" height="320" rx="18" fill="white"/>
  <!-- Header bar -->
  <rect x="124" y="96" width="256" height="72" rx="18" fill="#eef2ff"/>
  <rect x="124" y="132" width="256" height="36" fill="#eef2ff"/>
  <!-- Title text block -->
  <rect x="152" y="116" width="120" height="14" rx="7" fill="#4f46e5"/>
  <rect x="152" y="138" width="80" height="10" rx="5" fill="#a5b4fc"/>
  <!-- Invoice # badge -->
  <rect x="316" y="114" width="48" height="18" rx="9" fill="#4f46e5" opacity="0.15"/>
  <rect x="322" y="119" width="36" height="8" rx="4" fill="#4f46e5"/>
  <!-- Divider -->
  <rect x="152" y="190" width="200" height="2" rx="1" fill="#e0e7ff"/>
  <!-- Row 1 -->
  <rect x="152" y="208" width="100" height="10" rx="5" fill="#6366f1"/>
  <rect x="304" y="208" width="48" height="10" rx="5" fill="#6366f1"/>
  <!-- Row 2 -->
  <rect x="152" y="230" width="80" height="9" rx="4.5" fill="#c7d2fe"/>
  <rect x="304" y="230" width="48" height="9" rx="4.5" fill="#c7d2fe"/>
  <!-- Row 3 -->
  <rect x="152" y="251" width="90" height="9" rx="4.5" fill="#c7d2fe"/>
  <rect x="304" y="251" width="48" height="9" rx="4.5" fill="#c7d2fe"/>
  <!-- Row 4 -->
  <rect x="152" y="272" width="70" height="9" rx="4.5" fill="#e0e7ff"/>
  <rect x="304" y="272" width="48" height="9" rx="4.5" fill="#e0e7ff"/>
  <!-- Summary divider -->
  <rect x="152" y="300" width="200" height="2" rx="1" fill="#c7d2fe"/>
  <!-- Total row -->
  <rect x="152" y="314" width="60" height="11" rx="5.5" fill="#4f46e5"/>
  <rect x="286" y="312" width="66" height="15" rx="7.5" fill="#4f46e5"/>
  <!-- Balance due highlight -->
  <rect x="152" y="356" width="200" height="36" rx="12" fill="#4f46e5" opacity="0.08"/>
  <rect x="164" y="368" width="72" height="12" rx="6" fill="#4f46e5"/>
  <rect x="290" y="366" width="50" height="16" rx="8" fill="#ef4444"/>
</svg>
